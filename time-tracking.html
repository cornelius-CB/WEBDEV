<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link rel="stylesheet" href="style.css">
    <title>Time Tracking Dashboard</title>
</head>
<body>

<div class="container">

    <!-- PROFILE CARD -->
    <div class="box profile">
        <div class="profile-upper">
            <img src="images/avater.jpg" alt="PROFILE PIC">
            <div>
                <p class="report">Report for</p>
                <h2>Jeremy Robson</h2>
            </div>
        </div>

        <div class="profile-lower">
            <p>Daily</p>
            <p class="active">Weekly</p>
            <p>Monthly</p>
        </div>
    </div>


    <!-- WORK -->
    <div class="box work">
        <div class="content">
            <div class="title_section">
                <h3>Work</h3>
                <span>•••</span>
            </div>
            <h1>32hrs</h1>
            <p>Last Week - 36hrs</p>
        </div>
    </div>

    <!-- PLAY -->
    <div class="box play">
        <div class="content">
            <div class="title_section">
                <h3>Play</h3>
                <span>•••</span>
            </div>
            <h1>10hrs</h1>
            <p>Last Week - 8hrs</p>
        </div>
    </div>

    <!-- STUDY -->
    <div class="box study">
        <div class="content">
            <div class="title_section">
                <h3>Study</h3>
                <span>•••</span>
            </div>
            <h1>4hrs</h1>
            <p>Last Week - 7hrs</p>
        </div>
    </div>

    <!-- EXERCISE -->
    <div class="box exercise">
        <div class="content">
            <div class="title_section">
                <h3>Exercise</h3>
                <span>•••</span>
            </div>
            <h1>4hrs</h1>
            <p>Last Week - 5hrs</p>
        </div>
    </div>

    <!-- SOCIAL -->
    <div class="box social">
        <div class="content">
            <div class="title_section">
                <h3>Social</h3>
                <span>•••</span>
            </div>
            <h1>5hrs</h1>
            <p>Last Week - 10hrs</p>
        </div>
    </div>

    <!-- SELF CARE -->
    <div class="box selfcare">
        <div class="content">
            <div class="title_section">
                <h3>Self Care</h3>
                <span>•••</span>
            </div>
            <h1>2hrs</h1>
            <p>Last Week - 2hrs</p>
        </div>
    </div>

</div>

</body>
</html>
